# Không có key `database:` — Solid Cache dùng chung connection với app.
# Xem đầu config/database.yml.
default: &default
  store_options:
    # Cap age of oldest cache entry to fulfill retention policies
    # max_age: <%= 60.days.to_i %>
    max_size: <%= 256.megabytes %>
    namespace: <%= Rails.env %>

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default

staging:
  <<: *default
