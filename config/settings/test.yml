# Môi trường test. Giá trị cố định, KHÔNG đọc ENV: `docker compose` bơm .env
# vào process nên `ENV["X"] ||= ...` là no-op và test sẽ phụ thuộc máy chạy —
# lỗi này đã xảy ra một lần với CDN_HOST (xem HANDOFF).
test:
  app_host: www.example.com
  app_protocol: http

  s3:
    region: ap-southeast-1
    bucket_originals: test-originals
    bucket_derivatives: test-derivatives

  cdn_host: https://cdn.test.local
  photo_sizes: [ 400, 1200 ]
  mailer_sender: no-reply@test.local

  google:
    places_api_key: test-server-key
    maps_browser_key: test-browser-key
    maps_map_id: test-map-id
