# Kamal 2 — deploy Travelog lên MỘT EC2 t4g.small (2 vCPU Graviton, 2 GB RAM).
#
# Ngân sách RAM của cả box (~1.0-1.3 GB dùng thật, còn lại là page cache):
#   OS + dockerd  ~250 MB   kamal-proxy   ~40 MB
#   Puma + jobs   ~500 MB   Postgres      ~400 MB
#
# Ba quyết định bám theo ngân sách đó, đừng đảo lại mà không tính lại bảng trên:
#
#   1. Puma chạy MỘT process. config/puma.rb không hề có dòng `workers` nên
#      WEB_CONCURRENCY không có tác dụng — đặt nó vào đây cũng vô ích.
#   2. Solid Queue chạy TRONG Puma (SOLID_QUEUE_IN_PUMA=1, xem config/puma.rb).
#      Một container `worker` riêng là thêm một lần boot Rails, tốn ~250 MB cho
#      đúng cái hàng đợi mà app này gần như không dùng đến.
#   3. Postgres là accessory trên cùng host, KHÔNG phải RDS. Đổi lại: backup là
#      việc của mình — xem infra/ec2/pg_backup.sh.
#
# Image build ở máy Mac (Apple Silicon = arm64 = cùng kiến trúc Graviton, không
# cần QEMU) rồi push lên ECR. TUYỆT ĐỐI không build trên EC2: bundle install +
# assets:precompile sẽ thrash 2 GB RAM.
#
# HAI AWS ACCOUNT (xem infra/ec2/README.md → "Hai AWS account"):
#   compute — EC2 + ECR. registry.server và bin/kamal (ECR_PROFILE) trỏ vào đây.
#   media   — S3 + Lambda + CloudFront (infra/terraform). Rails vào đó bằng
#             access key tĩnh của IAM user account media, KHÔNG qua instance
#             profile — nên EC2 nằm ở account nào cũng không ảnh hưởng.
#
# Trước lần deploy đầu tiên: đọc infra/ec2/README.md. Có việc phải làm tay
# (tạo instance, ECR repo, DNS) mà file này không làm thay được.

service: travelog

image: travelog

servers:
  web:
    - 18.139.214.198

proxy:
  # TRUY CẬP BẰNG IP, KHÔNG CÓ TLS.
  #
  # ssl: false là bắt buộc khi dùng IP: Let's Encrypt không cấp chứng chỉ cho
  # địa chỉ IP, nên bật ssl sẽ làm ACME thất bại và app không bao giờ lên.
  #
  # Không khai `host` → kamal-proxy nhận mọi Host header và đẩy hết vào app.
  # Đó đúng là cái mình cần khi gõ thẳng IP vào trình duyệt.
  #
  # Truy cập: http://18.139.214.198  (cổng 80, KHÔNG phải 3000 — xem chú thích
  # app_port bên dưới). Muốn cổng vào là 3000 thì thêm khối `run` vào đây:
  #   run:
  #     http_port: 3000
  # rồi `bin/kamal proxy reboot`. Lúc đó phải mở cổng 3000 trong security group
  # và origin CORS phải là "http://18.139.214.198:3000" — cổng là một phần của
  # origin. (`kamal proxy boot_config` đã deprecated ở 2.12, đừng dùng.)
  #
  # Có domain rồi thì đảo lại: ssl: true + host: <domain>, và đặt
  # APP_PROTOCOL: https ở env.clear. Không cần sửa gì khác.
  ssl: false
  # Cổng của app BÊN TRONG container (Thruster nghe 80 ở đó), không phải cổng
  # người dùng gõ. 3000 chỉ là chuyện của docker compose ở máy local.
  app_port: 80
  healthcheck:
    path: /up # config/routes.rb:59
    interval: 5
    timeout: 60 # boot trên t4g.small chậm hơn máy local

registry:
  # ECR nằm ở account "compute" — CÙNG account với EC2, khác account chứa
  # S3/Lambda/CloudFront (xem đầu file). Token do bin/kamal lấy bằng
  # ECR_PROFILE rồi truyền vào qua env.
  #
  # Đổi sang GHCR thì thay ba dòng này bằng:
  #   server: ghcr.io
  #   username: <github-user>
  #   password: - KAMAL_REGISTRY_PASSWORD   (personal access token, scope write:packages)
  server: 757876532307.dkr.ecr.ap-southeast-1.amazonaws.com
  username: AWS
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: arm64 # Graviton. Build native trên Apple Silicon.

# Kamal giữ asset của bản cũ song song trong lúc deploy, nên tab đang mở không
# ăn 404 CSS khi digest đổi. Propshaft ghi ra đúng thư mục này.
asset_path: /rails/public/assets

ssh:
  # Amazon Linux 2023 arm64. Ubuntu thì đổi thành `ubuntu`.
  # infra/ec2/bootstrap.sh tự nhận ra distro, không cần sửa gì ở đó.
  user: ec2-user

# Đĩa 30 GB không nhiều. Giữ 2 bản để rollback được, prune phần còn lại
# (infra/ec2/bootstrap.sh cài cron dọn image hằng tuần).
retain_containers: 2

# Mặc định 30s là quá ngắn cho box này: container mới còn chạy db:prepare
# (bin/docker-entrypoint) trước khi Puma nghe cổng.
deploy_timeout: 120
drain_timeout: 30

# Kamal tự đặt --log-opt max-size=10m cho container app; 10 MB (một file) là
# quá ít để lần lại một sự cố hôm qua, mà đĩa thì có 30 GB. Accessory không có
# khai báo riêng nên chịu giới hạn ở /etc/docker/daemon.json (bootstrap.sh).
logging:
  driver: json-file
  options:
    max-size: 50m
    max-file: 3

env:
  clear:
    # --- Puma / Solid Queue: xem quyết định 1 và 2 ở đầu file ---
    RAILS_MAX_THREADS: 3
    SOLID_QUEUE_IN_PUMA: 1
    JOB_CONCURRENCY: 1
    # Ghi thẳng thay vì để config/database.yml tự tính, vì con số này phải
    # nằm dưới max_connections=30 của accessory db bên dưới.
    DB_POOL: 8

    # --- Postgres: tên container do Kamal đặt là <service>-<accessory> ---
    POSTGRES_HOST: travelog-db
    POSTGRES_PORT: 5432
    POSTGRES_DB: location_project_production
    POSTGRES_USER: location_project

    # --- Host của chính app ---
    # Đang truy cập bằng IP nên APP_PROTOCOL là http. Hai biến này quyết định
    # URL trong mail và — qua config/environments/production.rb — có bật
    # force_ssl hay không. Đổi sang https là đổi cả hai cùng lúc.
    APP_HOST: 18.139.214.198
    APP_PROTOCOL: http

    # --- Giá trị của stack ảnh, account "media" (infra/terraform) ---
    # Không phải secret nên nằm trong git, đúng quy ước cấu hình của repo.
    # Khớp workspace `production` của terraform, đã apply.
    CDN_HOST: https://d18cfkqnlgph1i.cloudfront.net
    S3_BUCKET_ORIGINALS: travelog-originals-production
    S3_BUCKET_DERIVATIVES: travelog-derivatives-production
    # Region của BUCKET (account media). Region của ECR là biến ECR_REGION
    # riêng trong bin/kamal — hai thứ khác nhau, có thể khác region.
    AWS_REGION: ap-southeast-1
    # Chỉ là địa chỉ From. SMTP chưa cấu hình nên chưa gửi được mail thật.
    MAILER_SENDER: no-reply@travelog.com

    GOOGLE_MAPS_MAP_ID: "" # SỬA nếu dùng Advanced Markers
    RAILS_LOG_LEVEL: info

  secret:
    - RAILS_MASTER_KEY
    - POSTGRES_PASSWORD
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
    - GOOGLE_MAPS_API_KEY
    - GOOGLE_MAPS_BROWSER_KEY

accessories:
  db:
    image: postgres:17-alpine
    host: 18.139.214.198 # cùng IP với servers.web
    # KHÔNG publish cổng ra host. App nói chuyện với nó qua network `kamal`
    # bằng tên container; psql/pg_dump thì `docker exec` vào (xem README).
    env:
      clear:
        # POSTGRES_USER ở đây là superuser khởi tạo của image, và đó là cố ý:
        # db/migrate/20260901155400_enable_postgres_extensions.rb gọi
        # CREATE EXTENSION (cube, earthdistance, pg_trgm, unaccent, pgcrypto)
        # và tạo function immutable_unaccent — cần superuser. Cho app dùng
        # luôn role này thì db:prepare chạy được ngay, khỏi màn bootstrap role.
        POSTGRES_USER: location_project
        POSTGRES_DB: location_project_production
        # Ổn định phần lớn kế hoạch truy vấn cho tiếng Việt + index trgm.
        LANG: C.UTF-8
      secret:
        - POSTGRES_PASSWORD
    volumes:
      # Bind mount để EBS snapshot và pg_dump nhìn thấy rõ ràng.
      # bootstrap.sh tạo thư mục; entrypoint của image tự chown.
      - /var/lib/travelog/postgres:/var/lib/postgresql/data
    options:
      # PG dùng /dev/shm cho dynamic shared memory; mặc định của Docker là 64 MB.
      shm-size: 256m
    # Tune cho 2 GB RAM / 2 vCPU burstable. Mặc định của Postgres giả định một
    # máy lớn hơn nhiều — riêng max_connections=100 đã là tiền RAM đổ đi.
    cmd: >-
      postgres
      -c max_connections=30
      -c shared_buffers=192MB
      -c effective_cache_size=640MB
      -c work_mem=8MB
      -c maintenance_work_mem=64MB
      -c wal_buffers=8MB
      -c max_wal_size=512MB
      -c min_wal_size=128MB
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c jit=off
      -c max_parallel_workers_per_gather=0
      -c max_parallel_workers=0
      -c autovacuum_naptime=30s
      -c autovacuum_vacuum_scale_factor=0.05
      -c autovacuum_analyze_scale_factor=0.05
      -c log_min_duration_statement=500
      -c log_checkpoints=on

# jit=off và max_parallel_workers=0 là chủ ý: query của app này nhỏ và nhiều,
# JIT với parallel worker chỉ đốt CPU credit của T-class chứ không nhanh hơn.
# autovacuum bị siết chặt hơn mặc định vì solid_cable poll 0.1s và solid_queue
# xoay vòng job liên tục — hai bảng đó bloat rất nhanh nếu để mặc định.

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs --follow
  # psql vào accessory. Auth qua unix socket nên không cần mật khẩu.
  dbc: accessory exec db --interactive --reuse "psql -U location_project -d location_project_production"
  # Migration bình thường tự chạy khi container mới boot (bin/docker-entrypoint).
  # Alias này để chạy tay khi cần, ví dụ sau khi rollback.
  migrate: app exec "bin/rails db:migrate"
