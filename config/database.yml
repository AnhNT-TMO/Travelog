# MỘT database Postgres cho tất cả: dữ liệu app, Solid Cache, Solid Queue,
# Solid Cable. Chủ dự án chốt gộp ngày 02.09.2026 — lượng dữ liệu không đủ lớn
# để tách bốn database, và một RDS instance nhỏ thì đơn giản hơn nhiều.
#
# Hệ quả: bảng solid_* nằm trong db/migrate như mọi bảng khác và được dump vào
# db/structure.sql. Không còn db/{cache,queue,cable}_schema.rb, không còn
# `schema_format: ruby` cho từng database, không còn `connects_to`.
#
# Đây là file DUY NHẤT cấu hình kết nối Postgres — nó được nạp trước
# config/settings/<env>.yml nên không đọc settings được, và hai nguồn sự thật
# cho cùng một thứ là lỗi chờ xảy ra.
default: &default
  adapter: postgresql
  encoding: unicode
  # Solid Queue, Solid Cache và Solid Cable dùng chung pool với web request —
  # pool phải rộng hơn RAILS_MAX_THREADS, nếu không worker sẽ tranh connection
  # với request và timeout dưới tải.
  pool: <%= ENV.fetch("DB_POOL") { Integer(ENV.fetch("RAILS_MAX_THREADS", 5)) + Integer(ENV.fetch("JOB_CONCURRENCY", 1)) * 3 + 2 } %>
  host: <%= ENV.fetch("POSTGRES_HOST", "localhost") %>
  port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>
  username: <%= ENV["POSTGRES_USER"] %>
  password: <%= ENV["POSTGRES_PASSWORD"] %>

development:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "location_project_development") %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_TEST_DB", "location_project_test") %>

staging:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "location_project_staging") %>
  username: <%= ENV.fetch("POSTGRES_USER", "location_project") %>
  password: <%= ENV["POSTGRES_PASSWORD"] %>

production:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "location_project_production") %>
  username: <%= ENV.fetch("POSTGRES_USER", "location_project") %>
  password: <%= ENV["POSTGRES_PASSWORD"] %>
