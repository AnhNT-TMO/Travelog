default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("DB_POOL") { Integer(ENV.fetch("RAILS_MAX_THREADS", 5)) + Integer(ENV.fetch("JOB_CONCURRENCY", 1)) * 3 + 2 } %>
  host: <%= ENV.fetch("POSTGRES_HOST", "localhost") %>
  port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>
  username: <%= ENV["POSTGRES_USER"] %>
  password: <%= ENV["POSTGRES_PASSWORD"] %>

development:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "travelog_development") %>

test:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_TEST_DB", "travelog_test") %>

staging:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "travelog_staging") %>
  username: <%= ENV.fetch("POSTGRES_USER", "travelog") %>
  password: <%= ENV["POSTGRES_PASSWORD"] %>

production:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "travelog_production") %>
  username: <%= ENV.fetch("POSTGRES_USER", "travelog") %>
  password: <%= ENV["POSTGRES_PASSWORD"] %>
